spring.datasource.url = jdbc:postgresql://10.1.11.100:9093/UserManagement
spring.datasource.username = postgres
spring.datasource.password = postgres
spring.datasource.driver-class-name = org.postgresql.Driver

eureka.client.service-url.defaultZone=http://10.1.11.100:7070/eureka/
eureka.client.should-unregister-on-shutdown=true
eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=25

#Redis Conf
spring.data.redis.host=10.1.11.100
spring.data.redis.port=6379
spring.data.redis.password=password_new
spring.data.redis.connect-timeout=1000
spring.data.redis.timeout=1000
spring.redis.jedis.pool.max-wait=1000

# Kafka
spring.kafka.bootstrap-servers=10.1.11.100:9092

# Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Timeouts
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.retry.backoff.ms=500