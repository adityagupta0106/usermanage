#CIRCUIT-BREAKER CONFIG

# Resilience4j Circuit Breaker Configuration NOTIFICATION
resilience4j.circuitbreaker.instances.Notification.registerHealthIndicator true
resilience4j.circuitbreaker.instances.Notification.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.Notification.slidingWindowType=count-based
resilience4j.circuitbreaker.instances.Notification.slidingWindowSize=10
resilience4j.circuitbreaker.instances.Notification.failureRateThreshold=30
resilience4j.circuitbreaker.instances.Notification.slow-call-rate-threshold=30
resilience4j.circuitbreaker.instances.Notification.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.Notification.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.Notification.automatic-transition-from-open-to-half-open-enabled=true

#Resilience4j Circuit Breaker Configuration LGD
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.registerHealthIndicator true
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.slidingWindowType=count-based
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.slidingWindowSize=10
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.failureRateThreshold=30
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.slow-call-rate-threshold=30
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.SERVICEPLUSLGD.automatic-transition-from-open-to-half-open-enabled=true

#Resilience4j Circuit Breaker Configuration DEFAULT
resilience4j.circuitbreaker.instances.default.registerHealthIndicator true
resilience4j.circuitbreaker.instances.default.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.default.slidingWindowType=count-based
resilience4j.circuitbreaker.instances.default.slidingWindowSize=20
resilience4j.circuitbreaker.instances.default.failureRateThreshold=30
resilience4j.circuitbreaker.instances.default.slow-call-rate-threshold=30
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.default.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry Configuration
#resilience4j.retry.instances.default.maxRetryAttempts=3
#resilience4j.retry.instances.default.waitDuration=500

# Actuator Exposure
management.endpoints.web.exposure.include=health,circuitbreakers,metrics

# Enable Debug Logging for Resilience4j Circuit Breaker
logging.level.io.github.resilience4j.circuitbreaker=DEBUG

instances.circuitBreaker.critical.error =  SERVICEPLUSLGD

user.creation.max.user.count = 9

id.generator.worker.id = 1
id.generator.datacenter.id =1

kafka.outbox.publish.delay-ms=10000


#modify-profile
modify.profile.email.sms.request.limit=5
modify.profile.email.sms.session.validity.min=1
modify.profile.email.sms.otp.attemps=3
modify.profile.email.sms.otp.attemps.block.time=10
modify.profile.email.sms.otp.validity.min=15
modify.profile.email.otp.subject=Modify Profile OTP
modify.profile.email.otp.content=Hi,<br/> Your One Time Password (OTP) is {0}. Validity-{1} mins.<br/>
modify.profile.image.max.limit=2
modify.profile.image.extensions=.png,.jpg,.jpeg


# Public tracking dependencies fail closed; do not retry OTP mutations automatically.
spring.cloud.openfeign.client.config.Integration.connectTimeout=3000
spring.cloud.openfeign.client.config.Integration.readTimeout=20000
