alert.activation.link=<html><body style="font-family: Arial, sans-serif; font-size: 14px; color: #333333;">\
<p>Hello,</p>\
<p>A request has been received to change/reset your password.</p>\
<p>Please click the link below to continue:</p>\
<p><a href="%s" style="background-color:#1976d2;color:white;padding:10px 16px;text-decoration:none;border-radius:4px;display:inline-block;">Reset Password</a></p>\
<p>If the button above does not work, copy and paste the following URL into your browser:</p>\
<p><a href="%s">%s</a></p>\
<br>\
<p>If you did not request this action, please ignore this email.</p>\
<p>Thank you,<br><strong>ServicePlus Team</strong></p>\
</body></html>

user.creation.email.subject = Created User List
user.creation.email.content=<html><body style="font-family: Arial, sans-serif; font-size: 14px; color: #333333;">\
<p>Hello,</p>\
<p>The requested user accounts have been created successfully.</p>\
<p>Please find the attached Excel file containing the generated user credentials and related details.</p>\
<p>Ensure that the credentials are shared securely with the respective users.</p>\
<br>\
<p><strong>Important:</strong></p>\
<ul>\
<li>Users should reset their passwords after first login.</li>\
<li>Do not share credentials over unsecured channels.</li>\
</ul>\
<br>\
<p>Thank you,<br><strong>ServicePlus Team</strong></p>\

